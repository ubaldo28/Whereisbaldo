name: Notify New Story

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Notify for every newly published story
        env:
          WEBPUSHR_KEY: ${{ secrets.WEBPUSHR_KEY }}
          WEBPUSHR_AUTH_TOKEN: ${{ secrets.WEBPUSHR_AUTH_TOKEN }}
        run: |
          CHANGED_FILES=$(git diff HEAD~1 HEAD --name-only -- 'src/content/posts/*.md' 2>/dev/null || echo "")

          for FILE in $CHANGED_FILES; do
            [ -f "$FILE" ] || continue

            OLD_DRAFT=$(git show HEAD~1:"$FILE" 2>/dev/null | grep '^draft:' | awk '{print $2}' || echo "")
            NEW_DRAFT=$(grep '^draft:' "$FILE" | awk '{print $2}' || echo "")

            if [ "$OLD_DRAFT" = "true" ] && [ "$NEW_DRAFT" = "false" ]; then
              TITLE=$(grep '^title:' "$FILE" | sed 's/^title: *//;s/^"//;s/"$//')
              SLUG=$(basename "$FILE" .md)

              # Build the JSON with jq so quotes and $ in titles cannot break or
              # inject into the command.
              PAYLOAD=$(jq -n \
                --arg title "New story from Baldo" \
                --arg message "$TITLE" \
                --arg url "https://whereisbaldo.com/blog/$SLUG" \
                '{title: $title, message: $message, target_url: $url}')

              curl -sS -X POST \
                -H "webpushrKey: $WEBPUSHR_KEY" \
                -H "webpushrAuthToken: $WEBPUSHR_AUTH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                https://api.webpushr.com/v1/notification/send/all

              echo "Notified: $TITLE"
            fi
          done
