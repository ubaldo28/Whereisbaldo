backend:
  name: github
  repo: ubaldo28/Whereisbaldo
  branch: main
  base_url: https://whereisbaldo.com
  auth_endpoint: api/auth

# Uploads land where Astro can resize and optimise them.
media_folder: src/assets/posts
public_folder: ../../assets/posts

site_url: https://whereisbaldo.com
display_url: https://whereisbaldo.com
logo_url: https://whereisbaldo.com/favicon.svg

collections:
  - name: posts
    label: Blog Posts
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: pubDate, widget: datetime, format: "YYYY-MM-DD" }
      - label: Tags
        name: tags
        widget: list
        default: ["Travel"]
      - { label: Photo, name: heroImage, widget: image, required: false, hint: "Optional. Shows at the top of the post and on the blog card." }
      - { label: Photo description, name: heroAlt, widget: string, required: false, hint: "What is in the photo — for screen readers and search." }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Hero Emoji, name: heroEmoji, widget: string, default: "✈️", required: false }
      - { label: Hero Color (CSS gradient stops), name: heroColor, widget: string, default: "#4A2C10, #8B5E2E", required: false }
      - { label: Body, name: body, widget: markdown }
